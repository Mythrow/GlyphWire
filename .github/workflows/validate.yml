name: Validate GlyphWire
on:
  push:
    branches: [main, 'glyphwire/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - run: npm run typecheck
      - run: python3 -m py_compile scripts/narrate.py scripts/mix_audio.py
